services:

  web-client:
    image: nginx:1.27-alpine
    container_name: tcp-chat-web-client
    restart: unless-stopped
    volumes:
      - ./client/web:/usr/share/nginx/html:ro
    ports:
      - "8090:80"
    depends_on:
      - chat-server-1
      - chat-server-2
    networks:
      - chat-net
      
  postgres:
    image: postgres:16-alpine
    container_name: tcp-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-net

  redis:
    image: redis:7-alpine
    container_name: tcp-chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-net

  chat-server-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tcp-chat-server-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INSTANCE_ID: srv1
      TCP_PORT: 3000
      WS_PORT: 8080
      TLS_ENABLED: ${TLS_ENABLED}
      TLS_CERT_PATH: ${TLS_CERT_PATH}
      TLS_KEY_PATH: ${TLS_KEY_PATH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: ${PG_DATABASE}
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL: ${REDIS_CHANNEL}
      DEFAULT_ROOMS: ${DEFAULT_ROOMS}
      HISTORY_LIMIT: ${HISTORY_LIMIT}
    ports:
      - "3000:3000"
      - "8080:8080"
    networks:
      - chat-net

  chat-server-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tcp-chat-server-2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INSTANCE_ID: srv2
      TCP_PORT: 3001
      WS_PORT: 8081
      TLS_ENABLED: ${TLS_ENABLED}
      TLS_CERT_PATH: ${TLS_CERT_PATH}
      TLS_KEY_PATH: ${TLS_KEY_PATH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS}
      HEARTBEAT_TIMEOUT_MS: ${HEARTBEAT_TIMEOUT_MS}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: ${PG_DATABASE}
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL: ${REDIS_CHANNEL}
      DEFAULT_ROOMS: ${DEFAULT_ROOMS}
      HISTORY_LIMIT: ${HISTORY_LIMIT}
    ports:
      - "3001:3001"
      - "8081:8081"
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge

volumes:
  pg-data:
